<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Dark background -->
  <rect width="80" height="80" rx="8" fill="#1A1A1A"/>
  <!-- Palm/hand silhouette -->
  <!-- Thumb -->
  <rect x="16" y="34" width="9" height="20" rx="4" fill="white"/>
  <!-- Index finger -->
  <rect x="26" y="22" width="9" height="32" rx="4" fill="white"/>
  <!-- Middle finger -->
  <rect x="36" y="18" width="9" height="36" rx="4" fill="white"/>
  <!-- Ring finger -->
  <rect x="46" y="22" width="9" height="32" rx="4" fill="white"/>
  <!-- Pinky -->
  <rect x="56" y="28" width="8" height="26" rx="4" fill="white"/>
  <!-- Palm base -->
  <rect x="16" y="50" width="48" height="18" rx="5" fill="white"/>
  <!-- Palm lines -->
  <line x1="22" y1="56" x2="56" y2="56" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="61" x2="52" y2="61" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="66" x2="48" y2="66" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
</svg>
