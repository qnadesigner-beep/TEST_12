<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <!-- Dark background -->
  <rect width="80" height="80" rx="8" fill="#1A1A1A"/>
  <!-- Gear path: 8-tooth gear centered at 40,40, outer r=30, inner r=22, tooth width -->
  <path d="
    M40,10
    L44,18 L52,14 L54,22 L62,22 L62,30 L70,32 L66,40
    L70,48 L62,50 L62,58 L54,58 L52,66 L44,62
    L40,70 L36,62 L28,66 L26,58 L18,58 L18,50 L10,48
    L14,40 L10,32 L18,30 L18,22 L26,22 L28,14 Z
  " fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Inner gear body -->
  <circle cx="40" cy="40" r="18" fill="none" stroke="white" stroke-width="2"/>
  <!-- Center hole -->
  <circle cx="40" cy="40" r="7" fill="none" stroke="white" stroke-width="2"/>
</svg>
