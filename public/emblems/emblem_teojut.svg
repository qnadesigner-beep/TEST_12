<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#F7F5F1"/>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#1A1A1A" stroke-width="1"/>
  <!-- Lantern handle (small rectangle on top) -->
  <rect x="94" y="65" width="12" height="8" rx="2" fill="#8B4A3B"/>
  <!-- Lantern top cap -->
  <rect x="84" y="73" width="32" height="7" rx="1" fill="#8B4A3B"/>
  <!-- Lantern body -->
  <rect x="82" y="80" width="36" height="44" rx="4" fill="#8B4A3B"/>
  <!-- Lantern light window -->
  <rect x="89" y="87" width="22" height="30" rx="3" fill="#F7F5F1" opacity="0.5"/>
  <!-- Lantern bottom cap -->
  <rect x="84" y="124" width="32" height="7" rx="1" fill="#8B4A3B"/>
  <!-- Flame shape inside -->
  <ellipse cx="100" cy="102" rx="6" ry="9" fill="#8B4A3B" opacity="0.7"/>
  <!-- Ribbon banner at bottom -->
  <polygon points="68,152 100,160 132,152 126,168 100,172 74,168" fill="#1A1A1A" opacity="0.75"/>
  <polygon points="68,152 62,162 74,168" fill="#1A1A1A" opacity="0.75"/>
  <polygon points="132,152 138,162 126,168" fill="#1A1A1A" opacity="0.75"/>
</svg>
