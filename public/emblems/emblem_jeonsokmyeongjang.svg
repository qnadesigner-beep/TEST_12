<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#F7F5F1"/>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#1A1A1A" stroke-width="1"/>
  <!-- Scroll body -->
  <rect x="72" y="76" width="56" height="52" rx="4" fill="#B8862B"/>
  <!-- Scroll top curl -->
  <ellipse cx="72" cy="76" rx="6" ry="10" fill="#B8862B"/>
  <ellipse cx="128" cy="76" rx="6" ry="10" fill="#B8862B"/>
  <!-- Scroll bottom curl -->
  <ellipse cx="72" cy="128" rx="6" ry="10" fill="#B8862B"/>
  <ellipse cx="128" cy="128" rx="6" ry="10" fill="#B8862B"/>
  <!-- Scroll inner lighter area -->
  <rect x="78" y="80" width="44" height="44" rx="2" fill="#F7F5F1" opacity="0.35"/>
  <!-- Diamond seal stamp on scroll -->
  <polygon points="100,87 112,100 100,113 88,100" fill="#B8862B"/>
  <polygon points="100,91 108,100 100,109 92,100" fill="#F7F5F1" opacity="0.5"/>
  <!-- Ribbon banner at bottom -->
  <polygon points="68,152 100,160 132,152 126,168 100,172 74,168" fill="#1A1A1A" opacity="0.75"/>
  <polygon points="68,152 62,162 74,168" fill="#1A1A1A" opacity="0.75"/>
  <polygon points="132,152 138,162 126,168" fill="#1A1A1A" opacity="0.75"/>
</svg>
